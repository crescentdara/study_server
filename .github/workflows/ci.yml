# GitHub Actions 화면에 표시되는 Workflow 이름
name: Backend CI/CD

# main 브랜치에 push가 발생하면 Workflow 실행
on:
  push:
    branches:
      - main


jobs:

  # =========================================================
  # 1. 백엔드 CI 빌드
  # =========================================================
  #
  # GitHub에서 제공하는 임시 Windows Runner에서 실행
  #
  # 역할:
  # - GitHub Repository 소스 다운로드
  # - Java 17 설치
  # - Maven 빌드
  # - JAR 생성
  # - 생성된 JAR을 Artifact로 업로드
  #
  # =========================================================
  backend-build:

    # 실제 배포 서버가 아니라
    # GitHub가 제공하는 임시 Windows 서버 사용
    runs-on: windows-latest

    steps:

      # -----------------------------------------------------
      # Repository 소스 다운로드
      # -----------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # -----------------------------------------------------
      # Java 17 설치
      #
      # distribution: temurin
      # → Eclipse Temurin JDK 사용
      #
      # cache: maven
      # → Maven dependency 캐시 사용
      # -----------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -----------------------------------------------------
      # Maven 빌드
      #
      # clean
      # → 기존 target 폴더 삭제
      #
      # package
      # → 컴파일 및 JAR 생성
      #
      # -DskipTests
      # → 테스트 코드는 컴파일
      # → 테스트 실행만 생략
      #
      # 성공하면:
      #
      # target\
      #   study-server-0.0.1-SNAPSHOT.jar
      #
      # 생성
      # -----------------------------------------------------
      - name: Build backend
        run: mvn clean package -DskipTests


      # -----------------------------------------------------
      # 생성된 JAR을 Artifact로 업로드
      #
      # GitHub-hosted Runner에서 만든 JAR을
      # 실제 배포 서버의 self-hosted Runner로
      # 전달하기 위해 사용
      #
      # Artifact 보관 기간은 7일
      # -----------------------------------------------------
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/study-server-0.0.1-SNAPSHOT.jar
          retention-days: 7



  # =========================================================
  # 2. 실제 백엔드 배포
  # =========================================================
  #
  # 여기부터는 실제 Windows 배포 서버에서 실행
  #
  # Runner:
  # self-hosted + backend
  #
  # 최종 배포 위치:
  #
  # C:\perpur\back\
  #   study-server-0.0.1-SNAPSHOT.jar
  #
  # =========================================================
  backend-deploy:

    # backend-build가 성공한 경우에만 실행
    needs: backend-build

    # backend label이 붙은 self-hosted Runner 사용
    runs-on: [self-hosted, backend]

    steps:

      # -----------------------------------------------------
      # CI 단계에서 생성한 JAR Artifact 다운로드
      #
      # Runner의 작업 폴더에:
      #
      # backend-artifact\
      #   study-server-0.0.1-SNAPSHOT.jar
      #
      # 형태로 다운로드됨
      # -----------------------------------------------------
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifact


      # -----------------------------------------------------
      # 현재 실행 중인 기존 Spring Boot 서버 종료
      #
      # 기존에 java 또는 javaw로 실행했을 수 있으므로
      # java.exe / javaw.exe 모두 검사
      #
      # 단순히 Java 전체를 죽이는 것이 아니라
      # CommandLine에 대상 JAR 이름이 포함된
      # 프로세스만 종료
      # -----------------------------------------------------
      - name: Stop existing backend
        shell: powershell
        run: |

          $jarName = "study-server-0.0.1-SNAPSHOT.jar"

          Write-Host "===================================="
          Write-Host "Stopping Backend"
          Write-Host "JAR : $jarName"
          Write-Host "===================================="


          # 실행 중인 대상 Spring Boot 프로세스 검색
          $processes = Get-CimInstance Win32_Process |
              Where-Object {
                  ($_.Name -eq "java.exe" -or $_.Name -eq "javaw.exe") -and
                  $_.CommandLine -like "*$jarName*"
              }


          if ($processes) {

              foreach ($process in $processes) {

                  Write-Host ""
                  Write-Host "Stopping process..."
                  Write-Host "PID  : $($process.ProcessId)"
                  Write-Host "Name : $($process.Name)"
                  Write-Host "CMD  : $($process.CommandLine)"

                  # 기존 백엔드 강제 종료
                  Stop-Process `
                    -Id $process.ProcessId `
                    -Force `
                    -ErrorAction Stop
              }


              # Windows가 JAR 파일 Lock을 해제할 시간을 줌
              Start-Sleep -Seconds 5
          }
          else {

              # 최초 배포이거나 이미 종료되어 있는 경우
              # 오류로 처리하지 않고 계속 진행
              Write-Host ""
              Write-Host "Running backend process not found."
          }


          # -------------------------------------------------
          # 프로세스가 실제로 종료되었는지 다시 확인
          # -------------------------------------------------
          $remaining = Get-CimInstance Win32_Process |
              Where-Object {
                  ($_.Name -eq "java.exe" -or $_.Name -eq "javaw.exe") -and
                  $_.CommandLine -like "*$jarName*"
              }


          if ($remaining) {

              Write-Error "Backend process is still running."

              $remaining |
                  Select-Object ProcessId, Name, CommandLine

              # 배포 중단
              exit 1
          }


          Write-Host ""
          Write-Host "Backend process stopped successfully."



      # -----------------------------------------------------
      # 새로운 JAR 실제 운영 경로에 배포
      #
      # Artifact:
      #
      # .\backend-artifact\
      #   study-server-0.0.1-SNAPSHOT.jar
      #
      # ↓
      #
      # C:\perpur\back\
      #   study-server-0.0.1-SNAPSHOT.jar
      #
      # -----------------------------------------------------
      - name: Deploy backend jar
        shell: powershell
        run: |

          # 실제 백엔드 배포 디렉터리
          $deployPath = "C:\perpur\back"

          # JAR 파일명
          $jarName = "study-server-0.0.1-SNAPSHOT.jar"

          # 실제 운영 JAR 전체 경로
          $targetJar = Join-Path $deployPath $jarName

          # Artifact로 다운로드 받은 새 JAR
          $sourceJar = ".\backend-artifact\$jarName"


          Write-Host "===================================="
          Write-Host "Backend Deploy Start"
          Write-Host "Source : $sourceJar"
          Write-Host "Target : $targetJar"
          Write-Host "===================================="


          # -------------------------------------------------
          # 배포 폴더가 없으면 생성
          # -------------------------------------------------
          if (!(Test-Path $deployPath)) {

              Write-Host "Creating backend directory..."

              New-Item `
                -ItemType Directory `
                -Path $deployPath `
                -Force
          }


          # -------------------------------------------------
          # 기존 JAR 삭제
          #
          # 앞 단계에서 프로세스를 종료했기 때문에
          # 정상이라면 파일 Lock이 풀려 있어야 함
          # -------------------------------------------------
          if (Test-Path $targetJar) {

              Write-Host ""
              Write-Host "Removing old JAR..."

              Remove-Item `
                $targetJar `
                -Force `
                -ErrorAction Stop
          }


          # -------------------------------------------------
          # 새로운 JAR 복사
          # -------------------------------------------------
          Write-Host ""
          Write-Host "Copying new JAR..."

          Copy-Item `
            -Path $sourceJar `
            -Destination $targetJar `
            -Force `
            -ErrorAction Stop


          Write-Host ""
          Write-Host "Backend JAR deployed."


          # -------------------------------------------------
          # 실제 배포된 JAR 정보 출력
          #
          # GitHub Actions 로그에서
          # 수정시간과 파일 크기 확인 가능
          # -------------------------------------------------
          Get-Item $targetJar |
              Select-Object FullName, LastWriteTime, Length



      # -----------------------------------------------------
      # 새로운 Spring Boot 서버 시작
      #
      # javaw.exe 사용
      #
      # 이유:
      # - 콘솔창 없이 백그라운드 실행
      # - GitHub Actions Job이 끝나더라도
      #   서버 프로세스는 계속 실행
      #
      # 실행 형태:
      #
      # javaw.exe -jar
      # C:\perpur\back\study-server-0.0.1-SNAPSHOT.jar
      #
      # -----------------------------------------------------
      - name: Start backend
        shell: powershell
        run: |

          $deployPath = "C:\perpur\back"
          $jarName = "study-server-0.0.1-SNAPSHOT.jar"
          $jarPath = Join-Path $deployPath $jarName


          Write-Host "===================================="
          Write-Host "Starting Backend"
          Write-Host "JAR : $jarPath"
          Write-Host "===================================="


          # -------------------------------------------------
          # javaw.exe를 이용해 백그라운드 실행
          # -------------------------------------------------
          Start-Process `
            -FilePath "javaw.exe" `
            -ArgumentList "-jar `"$jarPath`"" `
            -WorkingDirectory $deployPath `
            -WindowStyle Hidden


          # Spring Boot 기동 대기
          #
          # 서버 환경에 따라 필요하면
          # 10~20초로 늘려도 됨
          Start-Sleep -Seconds 10


          Write-Host ""
          Write-Host "Backend start command executed."



      # -----------------------------------------------------
      # 실제 백엔드 프로세스 실행 여부 검증
      #
      # java.exe / javaw.exe 중
      # 해당 JAR을 실행하는 프로세스가 있는지 확인
      #
      # 없으면 Workflow 실패 처리
      # -----------------------------------------------------
      - name: Verify backend process
        shell: powershell
        run: |

          $jarName = "study-server-0.0.1-SNAPSHOT.jar"


          Write-Host "===================================="
          Write-Host "Backend Process Check"
          Write-Host "===================================="


          $process = Get-CimInstance Win32_Process |
              Where-Object {
                  ($_.Name -eq "java.exe" -or $_.Name -eq "javaw.exe") -and
                  $_.CommandLine -like "*$jarName*"
              }


          if ($process) {

              Write-Host ""
              Write-Host "Backend is running successfully."

              $process |
                  Select-Object ProcessId, Name, CommandLine
          }
          else {

              Write-Error "Backend process was not started."

              # 프로세스를 찾지 못하면 Workflow 실패
              exit 1
          }