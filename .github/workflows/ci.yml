name: Backend CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend-build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7

  backend-deploy-test:
    needs: backend-build
    runs-on: [self-hosted, backend]

    steps:
      - name: Backend Runner Test
        run: |
          echo "Backend Runner OK"
          hostname
          whoami
          pwd