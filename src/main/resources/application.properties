# ============================================
# 애플리케이션 설정 파일
# Spring Boot는 이 파일을 자동으로 읽어서 설정에 적용합니다.
# ============================================

# 서버 포트 (기본값: 9090)
server.port=9900

# 로그 레벨 설정
# DEBUG: 개발 중 상세 로그 확인 (WebSocket 메시지 흐름 포함)
# INFO: 운영 환경에서 주로 사용
logging.level.com.studyplatform=DEBUG
logging.level.org.springframework.web.socket=INFO

# HTTP 세션 타임아웃 (30분 동안 요청 없으면 세션 만료)
server.servlet.session.timeout=30m

# JSON 직렬화 설정: null 값은 응답에서 제외
spring.jackson.default-property-inclusion=non_null
